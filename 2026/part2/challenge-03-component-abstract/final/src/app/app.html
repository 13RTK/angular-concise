<main>
  <button (click)="handleReset()">Reset</button>

  <circle-property [inputType]="'color'" [(property)]="circleForm.circleColor().value">
    Background color
  </circle-property>

  <circle-property [inputType]="'text'" [(property)]="circleForm.circleText().value">
    Circle Text
  </circle-property>

  <circle-property [inputType]="'number'" [(property)]="circleForm.circleSize().value"
    >Circle Size</circle-property
  >

  <circle-property
    [inputType]="'range'"
    [(property)]="circleForm.circleRotate().value"
    [min]="0"
    [max]="360"
  >
    Circle Rotate {{ circleForm.circleRotate().value() }}
  </circle-property>

  <div
    class="circle"
    [style]="{
      width: `${circleForm.circleSize().value()}px`,
      height: `${circleForm.circleSize().value()}px`,
      backgroundColor: `${circleForm.circleColor().value()}`,
      transform: `rotate(${circleForm.circleRotate().value()}deg)`,
    }"
  >
    {{ circleForm.circleText().value() }}
  </div>
</main>
