<form (submit)="(handleSearchMovie)" class="example-form">
  <mat-form-field class="example-full-width">
    <mat-label>Movie Title</mat-label>
    <input
      name="search-movie-title"
      [(ngModel)]="searchTitle"
      matInput
      placeholder="The title of movie"
    />
  </mat-form-field>

  <button (click)="handleSearchMovie()" type="submit" class="search-button" matButton="filled">
    Search
  </button>
</form>

@if (isLoading()) {
  <spinner> </spinner>
} @else if (searchMovieResults().length > 0) {
  @for (movie of searchMovieResults(); track $index) {
    <movie-list-item [movie]="movie"></movie-list-item>
  }
}
