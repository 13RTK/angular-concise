<mat-card class="chat-card">
  <mat-card-header>
    <mat-card-title>Cinemata AI</mat-card-title>
  </mat-card-header>

  <mat-card-content class="chat-body" cdkScrollable #scrollContainer>
    @for (msg of messages(); track $index) {
      <div class="bubble" [class.user]="msg.from === 'user'" [class.bot]="msg.from === 'bot'">
        {{ msg.text }}
      </div>
    }

    @if (isLoading()) {
      <p class="chat-loading">Loading...</p>
    }
  </mat-card-content>

  <mat-card-actions align="start" class="chat-input">
    <mat-form-field appearance="outline" class="full-width">
      <textarea
        matInput
        [(ngModel)]="draft"
        rows="2"
        (keydown.enter)="send($event)"
        placeholder="Ask Cinemata AI anything..."
      ></textarea>
    </mat-form-field>
    <button mat-icon-button color="primary" [disabled]="isLoading()" (click)="send()">
      <mat-icon>{{ isLoading() ? 'stop' : 'send' }}</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
