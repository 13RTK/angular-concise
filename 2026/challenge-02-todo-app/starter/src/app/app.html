<main class="challenge">
  <h1>Todo Challenge</h1>

  <div class="todo-form">
    <input class="todo-input" placeholder="Add a todo" />
    <button type="button">Add</button>
  </div>

  <ul class="todo-list">
    <li>
      <span> Todo Demo </span>

      <button class="action">Done</button>
      <button class="action delete">Remove</button>
    </li>
    <li>
      <span class="done"> Todo Demo </span>

      <button class="action">Undo</button>
      <button class="action delete">Remove</button>
    </li>
    <li class="empty">No todos</li>
  </ul>

  <p class="summary">X Todos</p>
</main>
