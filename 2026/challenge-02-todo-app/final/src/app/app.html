<main class="challenge">
  <h1>Todo Challenge</h1>

  <div class="todo-form">
    <input
      class="todo-input"
      placeholder="Add a todo"
      (input)="todoInput.set($event.target.value)"
      [value]="todoInput()"
    />
    <button type="button" (click)="handleAddTodo()">Add</button>
  </div>

  <ul class="todo-list">
    @for (todo of competedTodos(); track todo.id) {
      <li>
        <span [class]="todo.isCompleted ? 'done' : ''"> {{ todo.content }} </span>

        <button class="action" (click)="handleToggleTodo(todo.id)">
          {{ todo.isCompleted ? 'Undo' : 'Done' }}
        </button>
        <button class="action delete" (click)="handleRemoveTodo(todo.id)">Remove</button>
      </li>
    } @empty {
      <li class="empty">No todos</li>
    }
  </ul>

  <p class="summary">{{ todos().length }} Todos</p>
</main>
