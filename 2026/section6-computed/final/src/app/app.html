<main>
  <button (click)="handleReset()">Reset</button>

  <label>
    Background color
    <input type="color" [formField]="circleForm.circleColor" />
  </label>

  <label>
    Circle Text
    <input type="text" [formField]="circleForm.circleText" />
  </label>

  <label>
    Circle Size
    <input type="number" [formField]="circleForm.circleSize" />
  </label>

  <label>
    Circle Rotate {{ circleForm.circleRotate().value() }}
    <input type="range" [formField]="circleForm.circleRotate" />
  </label>
  <div class="circle" [style]="circleStyle()">
    {{ circleForm.circleText().value() }}
  </div>
</main>
